name: Civic Kernel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Run clean-environment quickstart
        run: |
          workdir="$(mktemp -d)"
          uv run civic-kernel generate --episodes 1 --seed 7 --db "$workdir/trajectory.db"
          uv run civic-kernel train --epochs 1 --seed 7 \
            --db "$workdir/trajectory.db" --checkpoint "$workdir/model.pth"
          test -s "$workdir/model.pth"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
