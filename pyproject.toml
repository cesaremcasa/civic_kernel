[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-kernel"
version = "0.2.0"
description = "Deterministic physics simulation kernel for world-model trajectories."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.1",
  "torch==2.13.0",
  "tqdm==4.66.3",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pip-audit==2.7.3",
  "pytest==9.0.3",
  "ruff==0.9.10",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
civic-kernel = "civic_kernel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "civic_kernel*", "kernel*", "simulation*", "viz*"]

[tool.setuptools.package-data]
civic_kernel = ["constants.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = false
